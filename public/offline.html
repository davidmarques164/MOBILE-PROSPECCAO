<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sem conexão — Prospecção</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #002760;
      text-align: center;
      padding: 2rem;
    }
    img { width: 96px; height: 96px; margin-bottom: 0.5rem; }
    h1 { font-size: 1.25rem; margin: 0; }
    p { margin: 0; color: #555; max-width: 320px; }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      border: none;
      background: #002760;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="Prospecção" />
  <h1>Sem conexão com a internet</h1>
  <p>Os dados de empresas vêm direto do servidor, então é preciso estar online para usar o app.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</body>
</html>
